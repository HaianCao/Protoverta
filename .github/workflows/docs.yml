name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install documentation tools
        run: python -m pip install -r docs/requirements.txt
      - name: Build (warnings are errors)
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - name: Check that every public export is documented
        run: |
          python - <<'PY'
          import ast, pathlib, re
          root = pathlib.Path("src/protoverta")
          exports = re.findall(r'"(\w+)"', (root / "__init__.py").read_text(encoding="utf-8").split("__all__")[1])
          documented = {
              node.name
              for path in root.glob("*.py")
              for node in ast.parse(path.read_text(encoding="utf-8")).body
              if isinstance(node, (ast.FunctionDef, ast.ClassDef)) and ast.get_docstring(node)
          }
          missing = [name for name in exports if name != "__version__" and name not in documented]
          assert not missing, f"public exports without a docstring: {missing}"
          PY
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    # Requires Settings > Pages > Source: GitHub Actions.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
