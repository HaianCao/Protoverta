name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test,typing]"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check src tests sdk_tests scripts fuzz_tests
      - name: Strict runtime boundary types
        run: python scripts/check_types.py
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist

  property-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[test,fuzz-test]"
      - run: python scripts/check_fuzz.py

  sdk-conformance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only SDK parsers
        run: python -m pip install -e ".[test,sdk-test]"
      - name: Independent SDK streams against scripted loopback upstreams
        run: python scripts/check_sdk.py
