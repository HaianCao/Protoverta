name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test,typing]"
      - name: Test
        run: python -m pytest --junitxml=source-tests.xml
      - name: Lint
        run: python -m ruff check src tests sdk_tests scripts fuzz_tests
      - name: Formatting
        run: python -m ruff format --check src tests sdk_tests scripts fuzz_tests
      - name: Strict runtime boundary types
        run: python scripts/check_types.py
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: source-tests-${{ runner.os }}-${{ matrix.python-version }}
          path: source-tests.xml

  property-conformance:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[test,fuzz-test]"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pip check
      - run: python scripts/check_fuzz.py --installed

  sdk-conformance:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test-only SDK parsers
        run: python -m pip install -e ".[test,sdk-test]"
      - name: Build wheel
        run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Replace editable source with the built wheel
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pip check
      - name: Independent SDK streams against scripted loopback upstreams
        run: python scripts/check_sdk.py --installed --report-dir sdk-report
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sdk-baseline-${{ runner.os }}-${{ matrix.python-version }}
          path: sdk-report
