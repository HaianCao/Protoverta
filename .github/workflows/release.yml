name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install -e ".[test,typing,sdk-test,fuzz-test]" build twine
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']=='v'+version, 'Tag must match pyproject.toml version'"
      - name: Test and lint
        run: |
          python -m pytest
          python -m ruff check src tests sdk_tests scripts fuzz_tests
          python scripts/check_types.py
          python scripts/check_sdk.py
          python scripts/check_fuzz.py
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Validate the actual release wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          python scripts/check_sdk.py --installed --report-dir release-wheel-sdk
          python scripts/check_fuzz.py --installed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-wheel-sdk
          path: release-wheel-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Publish immutable versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"
