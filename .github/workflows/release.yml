name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install -e ".[test,typing,sdk-test,fuzz-test]" build twine
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; version=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']=='v'+version, 'Tag must match pyproject.toml version'"
      - name: Test and lint
        run: |
          python -m pytest
          python -m ruff check src tests sdk_tests scripts fuzz_tests
          python -m ruff format --check src tests sdk_tests scripts fuzz_tests
          python scripts/check_types.py
          python scripts/check_sdk.py
          python scripts/check_fuzz.py
      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Validate the actual release wheel
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pip check
          python scripts/check_sdk.py --installed --report-dir release-wheel-sdk
          python scripts/check_fuzz.py --installed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-wheel-sdk
          path: release-wheel-sdk
      - name: Write SHA-256 checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.whl, dist/*.tar.gz
      - name: Publish versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${flags[@]}"

  pypi:
    # Trusted Publishing: configure a PyPI publisher for this repository,
    # workflow "release.yml" and environment "pypi", then set the repository
    # variable PYPI_PUBLISH to "true".
    needs: publish
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - name: Keep only the distributions
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1
