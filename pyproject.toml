[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "protoverta"
version = "0.4.0"
description = "A strict, provider-neutral adapter for Chat Completions, Messages, and Responses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []
authors = [{ name = "HaianCao", email = "caohaian2005@gmail.com" }]
keywords = ["llm", "openai", "anthropic", "chat-completions", "responses-api", "messages-api", "gateway", "protocol-adapter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/HaianCao/Protoverta"
Documentation = "https://haiancao.github.io/Protoverta/"
Repository = "https://github.com/HaianCao/Protoverta"
Issues = "https://github.com/HaianCao/Protoverta/issues"
Changelog = "https://github.com/HaianCao/Protoverta/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.17.2"]
typing = ["mypy==2.4.0"]
sdk-test = ["openai==3.37.0", "anthropic==2.3.0"]
fuzz-test = ["hypothesis==6.170.9"]
soak-test = ["psutil==7.2.2"]
browser-test = ["playwright==1.64.1"]
harness-test = ["pywinpty==3.1.2; sys_platform == 'win32'"]
coverage-test = ["coverage==7.17.0"]

[project.scripts]
protoverta = "protoverta.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/protoverta"]

[tool.hatch.build.targets.sdist]
# Development reports and validation artifacts are not part of a release.
exclude = ["docs/development", ".github", "fuzz_tests", "sdk_tests", "scripts"]

[tool.ruff]
# Formatter width; long literals that cannot wrap are left as written.
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# An explicit first tranche, not a claim that every codec is strictly typed.
[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src/protoverta"]
strict = true
follow_imports = "silent"
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
# Modules import ConversionError and Protocol through core.
module = "protoverta.core"
implicit_reexport = true
