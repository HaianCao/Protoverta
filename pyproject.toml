[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "protoverta"
version = "0.3.0a3"
description = "A strict, provider-neutral adapter for Chat Completions, Messages, and Responses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/HaianCao/Protoverta"
Issues = "https://github.com/HaianCao/Protoverta/issues"

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.17.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/protoverta"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
