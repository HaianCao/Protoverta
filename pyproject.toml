[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "protoverta"
version = "0.3.0a9"
description = "A strict, provider-neutral adapter for Chat Completions, Messages, and Responses"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/HaianCao/Protoverta"
Issues = "https://github.com/HaianCao/Protoverta/issues"

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.17.2"]
typing = ["mypy==2.4.0"]
sdk-test = ["openai==3.37.0", "anthropic==2.3.0"]
fuzz-test = ["hypothesis==6.170.9"]
soak-test = ["psutil==7.2.2"]
browser-test = ["playwright==1.64.1"]
harness-test = ["pywinpty==3.1.2; sys_platform == 'win32'"]
coverage-test = ["coverage==7.17.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/protoverta"]

[tool.ruff]
# Formatter width; long literals that cannot wrap are left as written.
line-length = 160

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

# An explicit first tranche, not a claim that every codec is strictly typed.
[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = [
  "src/protoverta/admission.py",
  "src/protoverta/automatic_reasoning.py",
  "src/protoverta/custom_tools.py",
  "src/protoverta/documents.py",
  "src/protoverta/errors.py",
  "src/protoverta/evidence_identity.py",
  "src/protoverta/failures.py",
  "src/protoverta/harness_controls.py",
  "src/protoverta/json_wire.py",
  "src/protoverta/lifetime.py",
  "src/protoverta/observability.py",
  "src/protoverta/reasoning.py",
  "src/protoverta/response_context.py",
  "src/protoverta/retry.py",
  "src/protoverta/routing.py",
  "src/protoverta/selection_status.py",
  "src/protoverta/sse.py",
]
strict = true
follow_imports = "silent"
warn_unreachable = true
show_error_codes = true
